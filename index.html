<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f5f7fb"
    />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </div>
        <p class="eyebrow">SIMPLE · FAST · GLOBAL</p>
        <h1>Currency converter</h1>
        <p class="intro">Convert currencies with the latest available rates.</p>
      </header>

      <form class="converter-card">
        <div class="amount">
          <label for="amount">Amount</label>
          <div class="amount-field">
            <span aria-hidden="true">$</span>
            <input id="amount" value="1" type="number" min="0.01" step="any" inputmode="decimal" />
          </div>
        </div>

        <div class="dropdown">
          <div class="currency-field from">
            <label for="from-currency">From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="" />
              <select id="from-currency" name="from" aria-label="Convert from"></select>
            </div>
          </div>

          <button class="swap-button" type="button" aria-label="Swap currencies" title="Swap currencies">
            <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
          </button>

          <div class="currency-field to">
            <label for="to-currency">To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="" />
              <select id="to-currency" name="to" aria-label="Convert to"></select>
            </div>
          </div>
        </div>

        <div class="result-panel" aria-live="polite" aria-atomic="true">
          <span class="result-label">Converted amount</span>
          <p class="msg">Enter an amount to convert</p>
        </div>

        <button class="convert-button" type="submit">
          Get exchange rate
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
        <p class="card-note">
          <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          Rates may vary from those offered by financial institutions.
        </p>
      </form>

      <footer class="page-footer">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
        <span>Exchange currencies with confidence</span>
      </footer>
    </main>
    <script src="codes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
